name: Deploy field guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Also runs on its own workflow for pull requests. Repeated here so a broken
      # rule cannot reach the published site even if something lands on main
      # without a PR — the pipeline commits straight to main every night.
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Privacy check (fails the build if EXIF or precise GPS is present)
        run: python3 scripts/plantdb.py verify
      - name: Build public/
        # --no-upload: the runner has no R2 credentials by design. Images are
        # uploaded from the machine that ingested them; this only builds URLs.
        run: python3 scripts/plantdb.py publish --no-upload
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn Pages on automatically instead of requiring a manual Settings step
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
